services:
  postgres:
    image: postgres:16-alpine
    container_name: iota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iota_api}
      POSTGRES_USER: ${POSTGRES_USER:-iota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iota} -d ${POSTGRES_DB:-iota_api}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iota-net

  redis:
    image: redis:7-alpine
    container_name: iota-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iota-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iota-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      APP_ENV: ${APP_ENV:-production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      ENABLE_HSTS: ${ENABLE_HSTS:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      IP_RATE_LIMIT_PER_MINUTE: ${IP_RATE_LIMIT_PER_MINUTE:-600}
      IP_RATE_LIMIT_KEYED_PER_MINUTE: ${IP_RATE_LIMIT_KEYED_PER_MINUTE:-6000}
      ADMIN_RATE_LIMIT_PER_MINUTE: ${ADMIN_RATE_LIMIT_PER_MINUTE:-20}
      YTDLP_MAX_CONCURRENCY: ${YTDLP_MAX_CONCURRENCY:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_storage:/app/storage
    # Bound to loopback: nginx is the only public entry point. The app
    # must not be reachable directly, otherwise the proxy headers it
    # trusts could be spoofed.
    ports:
      - "127.0.0.1:8000:8000"
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - iota-net

  nginx:
    image: nginx:1.27-alpine
    container_name: iota-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - iota-net

volumes:
  postgres_data:
  redis_data:
  api_storage:

networks:
  iota-net:
    driver: bridge
