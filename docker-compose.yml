services:
  postgres:
    image: postgres:16-alpine
    container_name: iota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iota_api}
      POSTGRES_USER: ${POSTGRES_USER:-iota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iota} -d ${POSTGRES_DB:-iota_api}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iota-net

  redis:
    image: redis:7-alpine
    container_name: iota-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iota-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iota-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_storage:/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - iota-net

  nginx:
    image: nginx:1.27-alpine
    container_name: iota-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - iota-net

volumes:
  postgres_data:
  redis_data:
  api_storage:

networks:
  iota-net:
    driver: bridge
