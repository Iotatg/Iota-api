worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # gzip ONLY for JSON metadata, NOT already-compressed audio
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    # Range / streaming support
    client_max_body_size 1m;
    client_body_buffer_size 128k;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Upstream: FastAPI
    upstream iota_api {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HTTP -> HTTPS redirect (uncomment in production with TLS)
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # HSTS: uncomment in production
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Block hidden files / dotfiles
        location ~ /\. {
            deny all;
            return 404;
        }

        # /stream/ — pass-through with caching disabled, support Range
        location /stream/ {
            proxy_pass http://iota_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;

            # Streaming-friendly: don't buffer audio
            proxy_buffering off;
            proxy_request_buffering off;

            # Pass through Range / If-Range
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # /info, /search, /stats — cacheable JSON (short TTL via app)
        location ~ ^/(info|search|stats|health) {
            proxy_pass http://iota_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /admin/* — restrict to internal in production (firewall / IP allowlist)
        location /admin/ {
            proxy_pass http://iota_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # In production, add: allow 10.0.0.0/8; deny all;
        }

        # /metrics — Prometheus, internal only
        location /metrics {
            proxy_pass http://iota_api;
            # In production, restrict to internal network
        }

        # Root
        location / {
            proxy_pass http://iota_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
