worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    types_hash_max_size 2048;
    server_tokens off;

    # ── Edge rate limiting (defense in depth) ───────────────────────────
    # The application enforces per-API-key quotas and a per-IP guard;
    # these zones stop a flood before it ever reaches the app workers.
    limit_req_zone $binary_remote_addr zone=general:16m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:16m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # gzip ONLY for JSON metadata, NOT already-compressed audio
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    # Range / streaming support
    client_max_body_size 1m;
    client_body_buffer_size 128k;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Upstream: FastAPI. keepalive connections to the app workers.
    upstream iota_api {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # A single client may not open an unbounded number of parallel
        # connections; 64 leaves room for many Range readers per client.
        limit_conn perip 64;
        limit_req zone=general burst=120 nodelay;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Do not advertise the stack.
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # Block hidden files / dotfiles
        location ~ /\. {
            deny all;
            return 404;
        }

        # /stream/ — pass-through with caching disabled, support Range
        location /stream/ {
            proxy_pass http://iota_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_pass_request_headers on;

            # Streaming-friendly: don't buffer audio
            proxy_buffering off;
            proxy_request_buffering off;

            # Pass through Range / If-Range
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # /download/ — large files, same streaming treatment
        location /download/ {
            proxy_pass http://iota_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # /info, /search, /stats — cacheable JSON (short TTL via app)
        location ~ ^/(info|search|stats|health) {
            proxy_pass http://iota_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # /admin/* — tight rate limit, and it must never be exposed to
        # the public internet. Keep the allow/deny block below restricted
        # to the internal network.
        location /admin/ {
            limit_req zone=admin burst=10 nodelay;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://iota_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # /metrics — Prometheus, internal only
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://iota_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
        }

        # Root
        location / {
            proxy_pass http://iota_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
